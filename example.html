<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>raw-text-display-parser example</title>
    <style>
      body {
        font:
          14px/1.4 system-ui,
          sans-serif;
        margin: 16px;
        color: #222;
        background: #fff;
      }

      h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #666;
        margin: 20px 0 6px;
      }

      textarea {
        width: 100%;
        box-sizing: border-box;
        height: 110px;
        font:
          14px/1.4 ui-monospace,
          monospace;
        padding: 8px;
      }

      .hint {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>

  <body>
    <h2>Input</h2>
    <textarea></textarea>
    <p class="hint">
      Try: <code>@alice</code>, <code>https://keet.io</code>,
      <code>pear://abc</code>, <code>:smile:</code>, <code>:keet_party:</code>,
      a line starting with <code>- </code> or <code>1. </code>, or a unicode
      emoji (😀).
    </p>

    <div id="visualizer"></div>
    <script src="example-parser.js"></script>
    <script src="example-visualizer.js"></script>
    <script type="module">
      const { Parser, typeNames } = await loadParser()

      const parser = createParser(Parser, {
        typeNames,
        onCallback: (name, args) => viz.logCallback(name, args)
      })

      const viz = createParserVisualizer(
        document.getElementById('visualizer'),
        { parser, typeNames }
      )

      bindTextarea(document.querySelector('textarea'), parser, () =>
        viz.render()
      )

      viz.render()
    </script>
  </body>
</html>
